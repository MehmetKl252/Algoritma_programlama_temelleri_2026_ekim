<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Döngüler – Ünite 4 Quiz</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2433;--muted:#5b6475;--line:#d9dde5;--accent:#2457c5;--sel:#e8effc;--ok:#1b7a43;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--text:#e8eaf0;--muted:#9aa3b5;--line:#343b49;--accent:#7aa2f7;--sel:#25304a;--ok:#6fcf97;--bad:#f28b82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Georgia,"Times New Roman",serif;padding:24px 16px}
main{max-width:680px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.95rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.q{font-size:1.1rem;white-space:pre-line;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt b{font-family:system-ui,sans-serif;min-width:1.4em;color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-family:system-ui,sans-serif}
.btn{font:inherit;font-family:system-ui,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score{font-size:2.4rem;margin:0}
.rev{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px 18px;margin-top:14px}
.rev.ok{border-left:5px solid var(--ok)}
.rev.no{border-left:5px solid var(--bad)}
.rev p{margin:.3rem 0;white-space:pre-line}
.tag{font-family:system-ui,sans-serif;font-size:.85rem}
.ok .tag{color:var(--ok)}.no .tag{color:var(--bad)}
.exp{color:var(--muted);font-size:.95rem}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Döngüler – Ünite 4</h1>
<p class="sub">Algoritma ve Programlamaya Giriş · 10 soru · Sonuç en sonda gösterilir</p>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>

<section id="quiz" class="card">
  <p class="sub" id="count"></p>
  <p class="q" id="qtext"></p>
  <div id="opts"></div>
  <div class="nav">
    <button class="btn ghost" id="prev">Geri</button>
    <button class="btn" id="next">İleri</button>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <p class="sub">Sonuç</p>
    <p class="score" id="score"></p>
    <p id="summary" class="sub"></p>
    <button class="btn" id="restart">Yeniden başla</button>
  </div>
  <div id="review"></div>
</section>
</main>

<script>
// c = doğru şıkkın indeksi (0=a, 1=b ...)
const Q=[
{q:"Tekrar sayısı baştan belli olan işlemler için hangi döngü yapısı kullanılır?",o:["do while…loop","do…loop while","for…next","if…else","select…case"],c:2,e:"Tekrar sayısı baştan belli ise for…next (ve for each…next) kullanılır."},
{q:"Koşulun döngü gövdesinden sonra kontrol edildiği ve gövdenin en az bir kez çalıştığı yapı hangisidir?",o:["do while…loop","do…loop while","for each…next","for…next","select…case"],c:1,e:"do…loop while yapısında kontrol sondadır; bu yüzden gövde en az bir kez çalışır."},
{q:"for each…next yapısı ne amaçla kullanılır?",o:["Sonsuz döngü kurmak","Bir kümedeki veya dizideki her eleman için işlem yapmak","Koşul doğru olana kadar işlem yapmak","Sayacı elle azaltmak","Değişken tanımlamak"],c:1,e:"for each…next, bir veri kümesindeki her eleman için aynı işlemin tekrarlanmasını sağlar."},
{q:"Döngülerde sayaç (counter) değişkeninin görevi nedir?",o:["Programı sonlandırmak","Değişken adlarını saymak","Tekrar sayısını kontrol etmek için her turda artırılan veya azaltılan değişken olmak","Koşulu her zaman doğru yapmak","Ekrana yazdırmak"],c:2,e:"Sayaç, her seferinde artırılıp azaltılarak tekrar sayısının kontrol edilmesini sağlar."},
{q:"Algoritma:\nsayaç = 0\nDO\n  sayaç = sayaç + 1\n  YAZ (sayaç)\nLOOP WHILE (sayaç < 3)\n\nÇıktı nedir?",o:["0 1 2","1 2","1 2 3","0 1 2 3","1 2 3 4"],c:2,e:"sayaç 1, 2, 3 olarak yazdırılır; sayaç 3 olunca koşul (3 < 3) yanlış olur ve döngü biter."},
{q:"Algoritma:\ni = 3\nDO WHILE (i < 10)\n  YAZ (i * 2)\n  i = i + 1\nLOOP\n\nEkrana kaç değer yazdırılır?",o:["6","7","8","10","3"],c:1,e:"i = 3, 4, …, 9 için döngü çalışır; 7 değer yazdırılır (6, 8, …, 18)."},
{q:"Algoritma:\nFAKT = 1, i = 1\nDO WHILE (i <= A)\n  FAKT = FAKT * i\n  i = i + 1\nLOOP\nYAZ (FAKT)\n\nA = 4 için çıktı nedir?",o:["10","16","24","120","4"],c:2,e:"4! = 1·2·3·4 = 24."},
{q:"Algoritma:\nFor i = 1 To 20 step 2\n  YAZ (i)\nNext i\n\nEn son yazdırılan değer nedir?",o:["20","19","18","21","2"],c:1,e:"i 1'den başlayıp 2'şer artar: 1, 3, …, 19. Sonraki değer 21 olup 20'yi aştığı için döngü biter."},
{q:"Algoritma:\ntoplam = 0\nFOR i = 1 TO 6\n  IF (i % 2 = 0) THEN\n    toplam = toplam + (i * i)\n  END IF\nNEXT i\nYAZ (toplam)\n\nÇıktı nedir?",o:["12","91","56","20","21"],c:2,e:"Çift sayılar 2, 4, 6: 4 + 16 + 36 = 56."},
{q:"for döngüsünde sayaç (indis) değeri döngü çalışırken değiştirilirse ne olur?",o:["Döngü daha hızlı çalışır","Hiçbir etkisi olmaz","Döngünün yapısı bozulur ve program sonsuz döngüye girebilir","Döngü otomatik olarak sonlanır","Sayaç sıfırlanır"],c:2,e:"Sayaç değeri döngü boyunca değiştirilmemelidir; değiştirilirse döngü yapısı bozulur ve sonsuz döngü oluşabilir."}
];
const L="abcde";
let i=0, ans=Array(Q.length).fill(null);
const $=id=>document.getElementById(id);

function render(){
  const q=Q[i];
  $("count").textContent=`Soru ${i+1} / ${Q.length}`;
  $("qtext").textContent=q.q;
  $("bar").style.width=((i)/Q.length*100)+"%";
  $("opts").innerHTML="";
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");
    b.className="opt"+(ans[i]===k?" sel":"");
    const s=document.createElement("b"); s.textContent=L[k]+")";
    const x=document.createElement("span"); x.textContent=t;
    b.append(s,x);
    b.onclick=()=>{ans[i]=k;render()};
    $("opts").appendChild(b);
  });
  $("prev").disabled=i===0;
  $("next").textContent=i===Q.length-1?"Bitir":"İleri";
  $("next").disabled=ans[i]===null;
}
$("prev").onclick=()=>{if(i>0){i--;render()}};
$("next").onclick=()=>{ if(i<Q.length-1){i++;render()} else finish(); };

function finish(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("bar").style.width="100%";
  let n=0; const R=$("review"); R.innerHTML="";
  Q.forEach((q,k)=>{
    const ok=ans[k]===q.c; if(ok)n++;
    const d=document.createElement("div");
    d.className="rev "+(ok?"ok":"no");
    const t=document.createElement("span"); t.className="tag"; t.textContent=`Soru ${k+1}: `+(ok?"Doğru":"Yanlış");
    const p=document.createElement("p"); p.textContent=q.q;
    const a=document.createElement("p"); a.textContent=`Senin cevabın: ${L[ans[k]]}) ${q.o[ans[k]]}`;
    d.append(t,p,a);
    if(!ok){const c=document.createElement("p"); c.textContent=`Doğru cevap: ${L[q.c]}) ${q.o[q.c]}`; d.append(c)}
    const e=document.createElement("p"); e.className="exp"; e.textContent=q.e;
    d.append(e); R.appendChild(d);
  });
  $("score").textContent=`${n} / ${Q.length}`;
  $("summary").textContent=`Yüzde ${Math.round(n/Q.length*100)} başarı`;
  window.scrollTo(0,0);
}
$("restart").onclick=()=>{ans=Array(Q.length).fill(null);i=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};
render();
</script>
</body>
</html>
