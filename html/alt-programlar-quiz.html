<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alt Programlar ve Fonksiyonlar – Ünite 5 Quiz</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2433;--muted:#5b6475;--line:#d9dde5;--accent:#2457c5;--sel:#e8effc;--ok:#1b7a43;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--text:#e8eaf0;--muted:#9aa3b5;--line:#343b49;--accent:#7aa2f7;--sel:#25304a;--ok:#6fcf97;--bad:#f28b82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Georgia,"Times New Roman",serif;padding:24px 16px}
main{max-width:680px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.95rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.q{font-size:1.1rem;white-space:pre-line;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt b{font-family:system-ui,sans-serif;min-width:1.4em;color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-family:system-ui,sans-serif}
.btn{font:inherit;font-family:system-ui,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score{font-size:2.4rem;margin:0}
.rev{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px 18px;margin-top:14px}
.rev.ok{border-left:5px solid var(--ok)}
.rev.no{border-left:5px solid var(--bad)}
.rev p{margin:.3rem 0;white-space:pre-line}
.tag{font-family:system-ui,sans-serif;font-size:.85rem}
.ok .tag{color:var(--ok)}.no .tag{color:var(--bad)}
.exp{color:var(--muted);font-size:.95rem}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Alt Programlar ve Fonksiyonlar – Ünite 5</h1>
<p class="sub">Algoritma ve Programlamaya Giriş · 10 soru · Sonuç en sonda gösterilir</p>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>

<section id="quiz" class="card">
  <p class="sub" id="count"></p>
  <p class="q" id="qtext"></p>
  <div id="opts"></div>
  <div class="nav">
    <button class="btn ghost" id="prev">Geri</button>
    <button class="btn" id="next">İleri</button>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <p class="sub">Sonuç</p>
    <p class="score" id="score"></p>
    <p id="summary" class="sub"></p>
    <button class="btn" id="restart">Yeniden başla</button>
  </div>
  <div id="review"></div>
</section>
</main>

<script>
// c = doğru şıkkın indeksi (0=a, 1=b ...)
const Q=[
{q:"Alt programların temel avantajı aşağıdakilerden hangisidir?",o:["Programın daha yavaş çalışması","Değişken sayısını artırması","Tekrar eden kodun bir kez yazılıp ihtiyaç olduğunda çağrılması","Ana programı gereksiz kılması","Veri tiplerini ortadan kaldırması"],c:2,e:"Tekrar eden kod bir yerde toplanıp çağrılır; böylece program kısalır, okunurluk artar ve değişiklik tek yerde yapılır."},
{q:"Bir alt programa, onu çağıran modülden gönderilen bilgilere ne ad verilir?",o:["Geri dönüş değeri","Parametre","Erişim niteleyicisi","Sayaç","İşaret (flag)"],c:1,e:"Alt programın iş yapabilmesi için çağıran modülden aldığı bilgilere parametre denir."},
{q:"Geriye değer döndürmeyen alt programlar tanımlanırken geri dönüş tipi yerine aşağıdakilerden hangisi yazılır?",o:["int","bool","double","void","return"],c:3,e:"Değer döndürmeyen alt programlar void (dile göre procedure, sub vb.) anahtar sözcüğüyle tanımlanır."},
{q:"Değer döndüren alt programlar (fonksiyonlar) nasıl çağrılır?",o:["Call komutuyla","Dönen değer uygun bir değişkene eşitlenerek","Hiçbir şekilde çağrılamaz","Sadece ana programın içinde tanımlanarak","Void yazılarak"],c:1,e:"Fonksiyonlar call ile değil, geri dönen değere uygun bir değişkene eşitlenerek çağrılır (örn. sonuç = topla(s1, s2))."},
{q:"Özyinelemeli (recursive) fonksiyon nedir ve tasarlanırken en çok nelere dikkat edilmelidir?",o:["Kendi kendini çağıran fonksiyondur; bitiş şartı unutulursa sonsuz çağrı oluşur","Hiç parametre almayan fonksiyondur; değişken tanımlamaya dikkat edilir","Sadece void olan alt programdır; return kullanılmamalıdır","Başka fonksiyonun içinde tanımlanan fonksiyondur","Ana programı çağıran fonksiyondur"],c:0,e:"Özyinelemeli fonksiyon kendini çağırır; bitiş şartı kontrol edilmezse durmaksızın kendini çağırır (sonsuz döngü benzeri)."},
{q:"Algoritma:\nint Topla(int n)\n  IF (n = 0) THEN return 0\n  ELSE return (n + Topla(n - 1))\n\nTopla(4) kaçtır?",o:["4","6","24","10","15"],c:3,e:"Topla(4) = 4 + 3 + 2 + 1 + 0 = 10."},
{q:"Algoritma:\ndouble Faktoriyel(int n)\n  IF (n = 0) THEN return 1\n  ELSE return (n * Faktoriyel(n - 1))\n\nFaktoriyel(3) kaçtır?",o:["3","6","9","1","12"],c:1,e:"Faktoriyel(3) = 3 · 2 · 1 = 6 (Faktoriyel(0) = 1)."},
{q:"Aşağıdaki alt program için hangi çağrı hata verir?\n\nint Topla (int a, int b)\n  t = a + b\n  return t",o:["Sonuç = Topla (sayi1, sayi2)","Sonuç = Topla (5, 7)","Sonuç = Topla (sayi1)","Sonuç = Topla (x, y)","Sonuç = Topla (3, 4)"],c:2,e:"Alt program çağrılırken parametre sayısı, sırası ve türü tanımla uyumlu olmalıdır. Topla (sayi1) eksik parametreli olduğu için hata verir."},
{q:"Bir alt program içinde tanımlanan değişken, alt program dışında kullanılmak istenirse ne olur?",o:["Normal şekilde çalışır","Değeri otomatik sıfırlanır","Hata alınır, çünkü değişken alt program dışında geçersizdir","Değişken otomatik olarak genel (public) olur","Program otomatik sonlanır"],c:2,e:"Alt programların içinde tanımlanan değişkenler alt program dışında kullanılamaz, geçersiz olurlar."},
{q:"Ana program (main) ile ilgili aşağıdakilerden hangisi doğrudur?",o:["Geriye değer döndürmeyen diğer alt programlardan farklı bir kod parçasıdır","Programın bulunduğu dosyanın başlamasını sağlayan başlangıç noktasıdır","Yalnızca fonksiyonlardan oluşur","Her zaman parametre almak zorundadır","Başka bir alt program tarafından çağrılır"],c:1,e:"Ana program, diğer prosedürlerden farklı olarak dosyanın başlamasını sağlayan başlangıç noktasıdır (void main, sub main vb.)."}
];
const L="abcde";
let i=0, ans=Array(Q.length).fill(null);
const $=id=>document.getElementById(id);

function render(){
  const q=Q[i];
  $("count").textContent=`Soru ${i+1} / ${Q.length}`;
  $("qtext").textContent=q.q;
  $("bar").style.width=((i)/Q.length*100)+"%";
  $("opts").innerHTML="";
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");
    b.className="opt"+(ans[i]===k?" sel":"");
    const s=document.createElement("b"); s.textContent=L[k]+")";
    const x=document.createElement("span"); x.textContent=t;
    b.append(s,x);
    b.onclick=()=>{ans[i]=k;render()};
    $("opts").appendChild(b);
  });
  $("prev").disabled=i===0;
  $("next").textContent=i===Q.length-1?"Bitir":"İleri";
  $("next").disabled=ans[i]===null;
}
$("prev").onclick=()=>{if(i>0){i--;render()}};
$("next").onclick=()=>{ if(i<Q.length-1){i++;render()} else finish(); };

function finish(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("bar").style.width="100%";
  let n=0; const R=$("review"); R.innerHTML="";
  Q.forEach((q,k)=>{
    const ok=ans[k]===q.c; if(ok)n++;
    const d=document.createElement("div");
    d.className="rev "+(ok?"ok":"no");
    const t=document.createElement("span"); t.className="tag"; t.textContent=`Soru ${k+1}: `+(ok?"Doğru":"Yanlış");
    const p=document.createElement("p"); p.textContent=q.q;
    const a=document.createElement("p"); a.textContent=`Senin cevabın: ${L[ans[k]]}) ${q.o[ans[k]]}`;
    d.append(t,p,a);
    if(!ok){const c=document.createElement("p"); c.textContent=`Doğru cevap: ${L[q.c]}) ${q.o[q.c]}`; d.append(c)}
    const e=document.createElement("p"); e.className="exp"; e.textContent=q.e;
    d.append(e); R.appendChild(d);
  });
  $("score").textContent=`${n} / ${Q.length}`;
  $("summary").textContent=`Yüzde ${Math.round(n/Q.length*100)} başarı`;
  window.scrollTo(0,0);
}
$("restart").onclick=()=>{ans=Array(Q.length).fill(null);i=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};
render();
</script>
</body>
</html>
